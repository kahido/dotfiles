# Use zsh as default
set -g default-shell /bin/zsh

# Enable 256-color and true-color (24-bit) support in tmux
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",alacritty*:Tc"

# General
set -g set-clipboard on
set -g detach-on-destroy off
set -g escape-time 0            # setting the delay between prefix and command
set -g history-limit 1000000
set -g mouse on
set -g status-interval 3
set -g allow-passthrough on
set -g status-position bottom

# Set prefix key
unbind C-b
set -g prefix C-a
set -g repeat-time 0
set -g focus-events on
bind-key C-a send-prefix

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Define vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# Style
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

set -g status-left-length 100
set -g status-right-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=#073642,bg=#eee8d5,bold] #S #[fg=#eee8d5,bg=#93a1a1,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #(whoami) #[fg=#93a1a1,bg=default]"
set -g status-right "#[fg=#586e75,bg=default,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#586e75] #{prefix_highlight} #[fg=#657b83,bg=#586e75,nobold,nounderscore,noitalics]#[fg=#93a1a1,bg=#657b83] #[fg=#93a1a1,bg=#657b83,nobold,nounderscore,noitalics]#[fg=#15161E,bg=#93a1a1,bold] #h "

setw -g window-status-current-format "#[fg=#002b36,bg=#eee8d5]#[fg=${gray_dark},bg=#eee8d5] #I #[fg=#eee8d5,bg=#b58900] #{window_name}#F #[fg=#b58900,bg=default,nobold]"

setw -g window-status-format "#[fg=#002b36,bg=${gray_light}]#[fg=#002b36,bg=${gray_light}] #I  #{window_name} #[fg=${gray_light},bg=default,nobold,nounderscore,noitalics]"

set -g message-style "fg=${gray_light},bg=default"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-border-lines simple
set -g pane-active-border-style "fg=${green_soft}"
